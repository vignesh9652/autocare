server:
  port: 8082

spring:
  application:
    name: vehicle-service

  datasource:
    url: jdbc:mysql://localhost:3306/vehicle_db
    username: root
    password: Vignesh@2004
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: 5a3f8c92b1e6d4a7f0c9e8b2d1a4f6c7e0d9b8a2f3c4e5d6a7b8c9d0e1f2a3b4
    expiration-ms: 86400000

---
# H2 in-memory profile: activate with --spring.profiles.active=h2
spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:vehicle_db
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console
