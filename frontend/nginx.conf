server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the Spring Cloud Gateway
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE - keep the stream open for live booking tracking
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Vehicle photos are stored locally by the vehicle-service and served from
    # /uploads/**. The API gateway only routes /api/**, so proxy these straight
    # to the vehicle-service container (same Docker network).
    # NOTE: ^~ is required so this prefix wins over the static-asset regex
    # location below (which would otherwise 404 .jpg/.jpeg/.png uploads).
    location ^~ /uploads/ {
        proxy_pass http://vehicle-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
