services:
  # ===================== INFRASTRUCTURE =====================

  mysql:
    image: mysql:8.0
    container_name: autocare-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Vignesh@2004
      MYSQL_DATABASE: autocare_users
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: autocare-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      # check_port_connectivity takes >10s (exceeds the timeout), use fast ping instead
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ===================== SERVICE REGISTRY =====================

  eureka-server:
    build: ../backend/eureka-server
    container_name: autocare-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      EUREKA_INSTANCE_HOSTNAME: eureka-server
      JAVA_TOOL_OPTIONS: "-Xmx256m"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===================== MICROSERVICES =====================

  user-service:
    build: ../backend/user-service
    container_name: autocare-user
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/autocare_users
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Vignesh@2004
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      # Cap JVM heap - default sizing OOMs on Docker Desktop's small VM
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      APP_JWT_SECRET: 5a3f8c92b1e6d4a7f0c9e8b2d1a4f6c7e0d9b8a2f3c4e5d6a7b8c9d0e1f2a3b4
      APP_JWT_EXPIRATION_MS: "86400000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  vehicle-service:
    build: ../backend/vehicle-service
    container_name: autocare-vehicle
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vehicle_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Vignesh@2004
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      # Cap JVM heap - default sizing OOMs on Docker Desktop's small VM
      JAVA_TOOL_OPTIONS: "-Xmx256m"
      APP_JWT_SECRET: 5a3f8c92b1e6d4a7f0c9e8b2d1a4f6c7e0d9b8a2f3c4e5d6a7b8c9d0e1f2a3b4
      APP_JWT_EXPIRATION_MS: "86400000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
